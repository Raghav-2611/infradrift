apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infradrift-ingress
  namespace: infradrift
  labels:
    app.kubernetes.io/name: infradrift
    app.kubernetes.io/component: ingress
  annotations:
    # Ingress class can also be set via spec.ingressClassName: nginx
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Route backend API calls directly to backend service
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: infradrift-backend
                port:
                  number: 8000
          # Route backend health checks to backend service
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: infradrift-backend
                port:
                  number: 8000
          # Route all other UI and static assets to frontend service
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infradrift-frontend
                port:
                  number: 80
