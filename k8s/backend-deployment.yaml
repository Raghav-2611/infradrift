apiVersion: apps/v1
kind: Deployment
metadata:
  name: infradrift-backend
  namespace: infradrift
  labels:
    app.kubernetes.io/name: infradrift
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: infradrift-backend
  template:
    metadata:
      labels:
        app: infradrift-backend
        app.kubernetes.io/name: infradrift
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: infradrift-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: infradrift-config
                  key: PORT
            - name: TERRAFORM_DIR
              valueFrom:
                configMapKeyRef:
                  name: infradrift-config
                  key: TERRAFORM_DIR
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: infradrift-secrets
                  key: database-url
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
