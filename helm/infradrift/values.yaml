# ==============================================================================
# InfraDrift Helm Values Configuration
# ==============================================================================

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/part-of: infradrift

# ------------------------------------------------------------------------------
# Frontend Configuration (React + Vite served via Nginx)
# ------------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 2

  image:
    repository: infradrift-frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

# ------------------------------------------------------------------------------
# Backend Configuration (FastAPI + Terraform Engine)
# ------------------------------------------------------------------------------
backend:
  enabled: true
  replicaCount: 2

  image:
    repository: infradrift-backend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  env:
    PORT: "8000"
    TERRAFORM_DIR: "/app/terraform"
    PYTHONUNBUFFERED: "1"

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health/ready
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

# ------------------------------------------------------------------------------
# PostgreSQL Database Configuration
# ------------------------------------------------------------------------------
postgresql:
  enabled: true

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  auth:
    username: infradrift_user
    database: infradrift
    # Overridden by secrets.postgresPassword or existingSecret
    password: "change_me_super_secret"
    existingSecret: ""

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  service:
    type: ClusterIP
    port: 5432

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# ------------------------------------------------------------------------------
# Secrets & Credentials Configuration
# ------------------------------------------------------------------------------
secrets:
  # Name of an externally created Secret to use instead of creating one
  existingSecret: ""
  postgresPassword: "change_me_super_secret"
  # Optional manual DATABASE_URL override. If omitted, constructed automatically
  databaseUrl: ""

# ------------------------------------------------------------------------------
# Ingress Configuration
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  hosts:
    - host: infradrift.local
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /health
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls: []
