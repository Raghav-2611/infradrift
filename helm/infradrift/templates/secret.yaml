{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infradrift.secretName" . }}
  labels:
    {{- include "infradrift.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | default .Values.postgresql.auth.password | quote }}
  database-url: {{ include "infradrift.databaseUrl" . | quote }}
{{- end }}
