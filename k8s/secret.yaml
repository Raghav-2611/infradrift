apiVersion: v1
kind: Secret
metadata:
  name: infradrift-secrets
  namespace: infradrift
  labels:
    app.kubernetes.io/name: infradrift
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # NOTE: Replace 'change_me_super_secret' with a secure random password before applying.
  postgres-password: "change_me_super_secret"
  # Connection string using psycopg v3 dialect for SQLAlchemy 2.0
  database-url: "postgresql+psycopg://infradrift_user:change_me_super_secret@infradrift-postgres:5432/infradrift"
