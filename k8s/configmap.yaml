apiVersion: v1
kind: ConfigMap
metadata:
  name: infradrift-config
  namespace: infradrift
  labels:
    app.kubernetes.io/name: infradrift
    app.kubernetes.io/component: configuration
data:
  POSTGRES_DB: "infradrift"
  POSTGRES_USER: "infradrift_user"
  POSTGRES_HOST: "infradrift-postgres"
  POSTGRES_PORT: "5432"
  TERRAFORM_DIR: "/app/terraform"
  PORT: "8000"
  BACKEND_URL: "http://infradrift-backend:8000"
