apiVersion: v1
kind: Service
metadata:
  name: infradrift-backend
  namespace: infradrift
  labels:
    app.kubernetes.io/name: infradrift
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app: infradrift-backend
