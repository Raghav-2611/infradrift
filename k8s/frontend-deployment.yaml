apiVersion: apps/v1
kind: Deployment
metadata:
  name: infradrift-frontend
  namespace: infradrift
  labels:
    app.kubernetes.io/name: infradrift
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: infradrift-frontend
  template:
    metadata:
      labels:
        app: infradrift-frontend
        app.kubernetes.io/name: infradrift
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: infradrift-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
